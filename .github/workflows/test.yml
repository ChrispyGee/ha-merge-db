name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04          # still provides Python 3.8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: python -m unittest -v test_ha_merge_db
      - name: Lint
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install flake8
          python -m flake8 ha_merge_db.py test_ha_merge_db.py
